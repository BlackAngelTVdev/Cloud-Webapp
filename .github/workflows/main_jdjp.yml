# Workflow attendu par Azure App Service (Deployment Center > GitHub Actions).
#
# Il a été supprimé du dépôt, ce qui laissait Azure bloqué sur
# "main_jdjp.yml introuvable" et empêchait tout déploiement.
#
# Différence importante avec l'ancien fichier généré par le portail : on
# déploie uniquement le dossier build/ (compilé + dépendances de prod) et
# non la racine du dépôt. Sur App Service, le point d'entrée est donc bien
# build/bin/server.js : la commande de démarrage doit rester
# "node bin/server.js".
#
# Configuration applicative : elle est fournie par le secret GitHub
# APP_ENV_FILE, qui contient le fichier .env (APP_KEY, DB_*, AZURE_*, SMTP_*).
# AdonisJS charge .env même en production (aucun garde NODE_ENV dans
# @adonisjs/env), donc aucune App Setting n'est nécessaire, sauf :
#   az webapp config appsettings set -g <rg> -n jdjp \
#     --settings SCM_DO_BUILD_DURING_DEPLOYMENT=false WEBSITES_PORT=8080
# et, si la commande de démarrage n'est pas déjà bonne :
#   az webapp config set -g <rg> -n jdjp --startup-file "node bin/server.js"
#
# NODE_ENV=production / PORT=8080 / HOST=0.0.0.0 sont forcés par le workflow
# (valeurs attendues par App Service Linux), le reste vient du secret.

name: Build and deploy Node.js app to Azure Web App - jdjp

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Une seule génération à la fois : évite deux déploiements concurrents.
# On n'interrompt jamais un déploiement en cours (un zip à moitié appliqué
# peut laisser l'application dans un état cassé).
concurrency:
  group: deploy-jdjp
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build project
        run: npm run build

      - name: Install production dependencies in build/
        run: cd build && npm ci --omit=dev --prefer-offline --no-audit --no-fund

      # Écrit build/.env à partir du secret APP_ENV_FILE. Le fichier reste
      # hors du dépôt (build/ et .env sont gitignored) et n'existe que dans
      # l'artefact déployé. NODE_ENV/PORT/HOST sont imposés pour App Service.
      - name: Create .env for App Service
        shell: bash
        env:
          ENV_CONTENT: ${{ secrets.APP_ENV_FILE }}
        run: |
          set -euo pipefail
          if [ -z "${ENV_CONTENT:-}" ]; then
            echo "::error::Le secret APP_ENV_FILE est vide : l'application ne pourra pas démarrer (APP_KEY, DB_* manquants)."
            exit 1
          fi
          # tr : neutralise d'éventuels retours chariot (copier/coller Windows).
          printf '%s\n' "$ENV_CONTENT" \
            | tr -d '\r' \
            | grep -v -E '^(NODE_ENV|PORT|HOST)[[:space:]]*=' \
            > build/.env || true
          printf 'NODE_ENV=production\nPORT=8080\nHOST=0.0.0.0\n' >> build/.env
          # Vérifie que le fichier n'est pas vide et ne fuit pas dans le log.
          echo "build/.env : $(wc -l < build/.env) lignes"
          grep -q '^APP_KEY=' build/.env || {
            echo "::error::APP_KEY absent du secret APP_ENV_FILE."
            exit 1
          }

      - name: Package deployment artifact
        shell: bash
        run: |
          set -euo pipefail
          # L'application doit être à la racine du zip pour App Service.
          (cd build && zip -rq ../app.zip . -x '*.git*')

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: app.zip
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://jdjp-dtbmafa8exava5aj.switzerlandnorth-01.azurewebsites.net
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'jdjp'
          slot-name: 'Production'
          package: app.zip
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_02B4A6BDB148467D881A410EF039991D }}
