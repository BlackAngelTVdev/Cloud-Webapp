# Workflow de diagnostic TEMPORAIRE.
#
# Il utilise le profil de publication déjà stocké en secret pour interroger
# l'API Kudu de l'App Service : fichier de log du conteneur, version de Node,
# contenu de wwwroot.
#
# Le rapport est publié sur la branche "diag-output" (et non sur main) pour
# rester lisible sans droits sur le dépôt et sans déclencher de déploiement.
#
# À supprimer (avec la branche) une fois la cause du 503 identifiée.

name: Diag jdjp

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/diag-jdjp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collecter les informations
        env:
          PROFILE: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_02B4A6BDB148467D881A410EF039991D }}
        run: |
          set -uo pipefail
          WORK="$RUNNER_TEMP"
          OUT="$WORK/diag.txt"
          BASE="https://jdjp-dtbmafa8exava5aj.scm.switzerlandnorth-01.azurewebsites.net"
          : > "$OUT"
          log() { echo "$@" | tee -a "$OUT"; }

          log "# Rapport de diagnostic $(date -u +%FT%TZ)"
          log

          # --- Identifiants Kudu -------------------------------------------
          printf '%s' "${PROFILE:-}" | base64 -d > "$WORK/profile.xml" 2>/dev/null || true
          if ! grep -q '<publishData' "$WORK/profile.xml" 2>/dev/null; then
            printf '%s' "${PROFILE:-}" > "$WORK/profile.xml"
          fi
          python3 /dev/stdin "$WORK" <<'PY' || true
          import re, sys, pathlib
          tmp = pathlib.Path(sys.argv[1])
          xml = (tmp / 'profile.xml').read_text(encoding='utf-8-sig', errors='replace')
          user = re.search(r'userName="([^"]+)"', xml)
          password = re.search(r'userPWD="([^"]+)"', xml)
          if user:
              (tmp / 'kudu_user').write_text(user.group(1))
          if password:
              (tmp / 'kudu_pass').write_text(password.group(1))
          PY
          if [ -s "$WORK/kudu_pass" ]; then
            echo "::add-mask::$(cat "$WORK/kudu_pass")"
          fi
          AUTH="$(cat "$WORK/kudu_user" 2>/dev/null || echo nav):$(cat "$WORK/kudu_pass" 2>/dev/null || echo nav)"

          # --- Liste puis contenu du log du conteneur ----------------------
          log "## LogFiles"
          curl -sS -u "$AUTH" --max-time 40 "$BASE/api/vfs/LogFiles/" > "$WORK/files.json" 2>/dev/null || true
          cat > "$WORK/picklog.py" <<'PY'
          import json, sys
          try:
              data = json.load(open(sys.argv[1]))
          except Exception as exc:
              print(f"liste illisible : {exc}")
              data = []
          for entry in data:
              print(entry.get('name'), entry.get('size'))
          names = [e['name'] for e in data if 'docker' in e.get('name', '')]
          open(sys.argv[2], 'w').write(sorted(names)[-1] if names else '')
          PY
          python3 "$WORK/picklog.py" "$WORK/files.json" "$WORK/logname" | tee -a "$OUT" || true
          log

          LOGNAME="$(cat "$WORK/logname" 2>/dev/null || true)"
          log "## docker log : ${LOGNAME:-introuvable}"
          if [ -n "${LOGNAME:-}" ]; then
            curl -sS -u "$AUTH" --max-time 45 "$BASE/api/vfs/LogFiles/$LOGNAME" 2>&1 | tail -n 300 | tee -a "$OUT" || true
          fi
          log

          # --- Commandes simples (l'API Kudu n'accepte pas de shell) --------
          run_cmd() {
            cmd="$1"
            dir="${2:-/home/site/wwwroot}"
            printf '{"command":"%s","dir":"%s"}' "$cmd" "$dir" > "$WORK/cmd.json"
            log "\$ $cmd  (dans $dir)"
            curl -sS -u "$AUTH" -H 'Content-Type: application/json' -X POST \
              --max-time 40 -d @"$WORK/cmd.json" "$BASE/api/command" 2>&1 | tee -a "$OUT" || true
            log
          }

          run_cmd "node -v"
          run_cmd "ls -la"
          run_cmd "ls -la" "/home/site/wwwroot/bin"
          run_cmd "cat package.json"

          echo "rapport : $(wc -l < "$OUT") lignes"

      - name: Publier le rapport sur la branche diag-output
        run: |
          set -euo pipefail
          mkdir -p diag-output
          cp "$RUNNER_TEMP/diag.txt" diag-output/latest.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -q -B diag-output
          git add -f diag-output/latest.txt
          git commit -q -m "diag: rapport $(date -u +%FT%TZ)"
          git push -f origin diag-output
