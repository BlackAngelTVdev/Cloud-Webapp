name: Build and Release

# Déclenché sur push main (release si la version change) et manuellement.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# ---------------------------------------------------------------------------
# Ce workflow ne fait que construire l'application et publier une release
# GitHub lorsque la version de package.json change.
#
# Le déploiement sur Azure App Service est assuré par main_jdjp.yml : c'est
# le fichier que le Deployment Center d'Azure suit. Garder un seul chemin de
# déploiement évite deux publications concurrentes sur le même App Service.
#
# Artefact de release : build-v<version>.zip (arborescence build/ conservée)
# et deploy-v<version>.zip (application à la racine, utilisable à la main).
# ---------------------------------------------------------------------------

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Doit rester aligné sur la pile d'exécution de l'App Service (Node 22-lts).
env:
  NODE_VERSION: '22'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.new_version }}
      version_changed: ${{ steps.version.outputs.version_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Nécessaire pour comparer avec le commit précédent
          persist-credentials: false

      - name: Check version change
        id: version
        shell: bash
        run: |
          set -euo pipefail
          # Récupère la version actuelle et la précédente
          NEW_VERSION=$(node -p "require('./package.json').version")
          if git rev-parse --verify --quiet 'HEAD^1^{commit}' >/dev/null 2>&1; then
            OLD_VERSION=$(git show HEAD^1:package.json 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version" || echo "0.0.0")
          else
            OLD_VERSION="0.0.0"
          fi
          echo "Version précédente : $OLD_VERSION"
          echo "Version actuelle : $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          if [ "$NEW_VERSION" != "$OLD_VERSION" ]; then
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
            echo "Version inchangée : pas de nouvelle release (le déploiement reste possible via workflow_dispatch)."
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/node-gyp
          key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.NODE_VERSION }}-

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build project
        run: npm run build

      - name: Install production dependencies in build/
        run: cd build && npm ci --omit=dev --prefer-offline --no-audit --no-fund

      - name: Package release artifact
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.new_version }}"
          # Archive de release : conserve l'arborescence build/ (comportement historique)
          zip -r "build-v${VERSION}.zip" build/
          # Archive de déploiement App Service : l'application est à la racine du zip
          (cd build && zip -rq "../deploy-v${VERSION}.zip" . -x '*.git*')

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ steps.version.outputs.new_version }}
          path: |
            build-v${{ steps.version.outputs.new_version }}.zip
            deploy-v${{ steps.version.outputs.new_version }}.zip
          retention-days: 14
          if-no-files-found: error

  release:
    needs: build
    if: needs.build.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-${{ needs.build.outputs.version }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: Release v${{ needs.build.outputs.version }}
          generate_release_notes: true
          files: build-v${{ needs.build.outputs.version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
