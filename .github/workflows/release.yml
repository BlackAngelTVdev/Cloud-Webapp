name: Build, Release and Deploy (Azure App Service)

# Déclenché sur push main (release si la version change) et manuellement (redéploiement à la demande).
on:
  push:
    branches:
      - main
  workflow_dispatch:

# ---------------------------------------------------------------------------
# Prérequis côté GitHub (Settings > Secrets and variables > Actions)
#   - Secret  AZURE_WEBAPP_PUBLISH_PROFILE : contenu du fichier de publication
#                                            (Portail Azure > App Service > Vue d'ensemble
#                                             > "Obtenir le profil de publication")
#   - Variable AZURE_WEBAPP_NAME : nom de l'App Service (ex: jdjp-api).
#     Tant que cette variable n'est pas définie, le job de déploiement est
#     simplement ignoré : main reste vert et seule la release est publiée.
#
# Prérequis côté Azure (une seule fois) :
#   az webapp config appsettings set -g <rg> -n <app> --settings \
#     NODE_ENV=production \
#     HOST=0.0.0.0 \
#     PORT=8080 \
#     APP_KEY=<node ace generate:key> \
#     SESSION_DRIVER=cookie \
#     DB_TYPE=mysql DB_HOST=... DB_PORT=3306 DB_USER=... DB_PASSWORD=... DB_DATABASE=... \
#     AZURE_CLIENT_ID=... AZURE_CLIENT_SECRET=... AZURE_TENANT_ID=... \
#     AZURE_REDIRECT_URI=https://<app>.azurewebsites.net/auth/microsoft/callback \
#     AZURE_POST_LOGOUT_REDIRECT_URI=https://<app>.azurewebsites.net/choix-login \
#     SCM_DO_BUILD_DURING_DEPLOYMENT=false
#   az webapp config set -g <rg> -n <app> --startup-file "node bin/server.js"
#   az webapp config set -g <rg> -n <app> --always-on true
#
# Le déploiement envoie uniquement le dossier build/ (dépendances de prod
# incluses) : aucune compilation n'est faite par la plateforme.
# ---------------------------------------------------------------------------

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Doit rester aligné sur la pile d'exécution de l'App Service (Node 22-lts).
env:
  NODE_VERSION: '22'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.new_version }}
      version_changed: ${{ steps.version.outputs.version_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Nécessaire pour comparer avec le commit précédent
          persist-credentials: false

      - name: Check version change
        id: version
        shell: bash
        run: |
          set -euo pipefail
          # Récupère la version actuelle et la précédente
          NEW_VERSION=$(node -p "require('./package.json').version")
          if git rev-parse --verify --quiet 'HEAD^1^{commit}' >/dev/null 2>&1; then
            OLD_VERSION=$(git show HEAD^1:package.json 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version" || echo "0.0.0")
          else
            OLD_VERSION="0.0.0"
          fi
          echo "Version précédente : $OLD_VERSION"
          echo "Version actuelle : $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          if [ "$NEW_VERSION" != "$OLD_VERSION" ]; then
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
            echo "Version inchangée : pas de nouvelle release (le déploiement reste possible via workflow_dispatch)."
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/node-gyp
          key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.NODE_VERSION }}-

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build project
        run: npm run build

      - name: Install production dependencies in build/
        run: cd build && npm ci --omit=dev --prefer-offline --no-audit --no-fund

      - name: Package release artifact
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.new_version }}"
          # Archive de release : conserve l'arborescence build/ (comportement historique)
          zip -r "build-v${VERSION}.zip" build/
          # Archive de déploiement App Service : l'application est à la racine du zip
          (cd build && zip -rq "../deploy-v${VERSION}.zip" . -x '*.git*')

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ steps.version.outputs.new_version }}
          path: |
            build-v${{ steps.version.outputs.new_version }}.zip
            deploy-v${{ steps.version.outputs.new_version }}.zip
          retention-days: 14
          if-no-files-found: error

  release:
    needs: build
    if: needs.build.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-${{ needs.build.outputs.version }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: Release v${{ needs.build.outputs.version }}
          generate_release_notes: true
          files: build-v${{ needs.build.outputs.version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: build
    # Ignoré tant que l'App Service n'est pas déclaré dans les variables du dépôt.
    if: >-
      vars.AZURE_WEBAPP_NAME != '' &&
      (needs.build.outputs.version_changed == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-${{ needs.build.outputs.version }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: deploy-v${{ needs.build.outputs.version }}.zip
